name: Archive sample work images
on:
  push:
    paths: ['.github/sample-work.txt']
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Download and convert
        run: |
          mkdir -p media/work full raw
          while read -r url name; do
            [ -z "$url" ] && continue
            curl -sf --retry 3 -o "raw/$name.png" "$url"
          done < .github/sample-work.txt
          python3 - <<'PY'
          from PIL import Image
          import glob, os
          for p in sorted(glob.glob('raw/*.png')):
              n = os.path.splitext(os.path.basename(p))[0]
              im = Image.open(p).convert('RGB')
              im.save(f'full/{n}.jpg', quality=92, optimize=True)
              im.resize((720, 900), Image.LANCZOS).save(f'media/work/{n}.webp', quality=80, method=6)
              im.resize((440, 550), Image.LANCZOS).save(f'media/work/{n}-sm.webp', quality=78, method=6)
          print(len(glob.glob('media/work/*.webp')), 'webp files')
          PY
          du -sh media/work full
      - name: Add full-size originals to the originals branch
        run: |
          git config user.name "Marinko Rudela"
          git config user.email marinko@sokolsystems.io
          git fetch -q origin sample-work-originals
          git worktree add -q /tmp/orig origin/sample-work-originals
          cp full/*.jpg /tmp/orig/
          cd /tmp/orig && git add *.jpg && git commit -qm "More full-size sample work originals" && git push origin HEAD:sample-work-originals
      - name: Commit web images
        run: |
          git config user.name "Marinko Rudela"
          git config user.email marinko@sokolsystems.io
          git add media/work
          git commit -m "Add sample work images for the website carousel" || echo "nothing to commit"
          git push
